<svg viewBox="0 0 640 330" role="img" aria-label="Esquema dos trajetos a pe saindo do CAES na Praca Julio Prestes">
  <style>
    .via   { stroke: var(--vm-cl); stroke-width: 7; fill: none; stroke-linecap: round; }
    .ramo  { stroke: var(--tx3); stroke-width: 3.5; fill: none; stroke-linecap: round;
             stroke-dasharray: 7 6; }
    .ponto { fill: var(--card); stroke: var(--vm-cl); stroke-width: 3.5; }
    .orig  { fill: var(--vm-cl); stroke: var(--card); stroke-width: 3.5; }
    .tit   { fill: var(--tx); font: 700 15px system-ui, sans-serif; }
    .nome  { fill: var(--tx); font: 700 13px system-ui, sans-serif; }
    .dado  { fill: var(--tx2); font: 12px system-ui, sans-serif; }
    .fraco { fill: var(--tx3); font: 11.5px system-ui, sans-serif; }
    .rua   { fill: var(--tx3); font: italic 12px system-ui, sans-serif; }
  </style>

  <text class="tit" x="16" y="24">A pé, saindo da frente do CAES</text>
  <text class="fraco" x="16" y="42">Esquema de direção e distância. Não é mapa de ruas nem está em escala.</text>

  <!-- ramo oeste: Santa Cecilia, sentido oposto ao corredor -->
  <path class="ramo" d="M 150 175 L 150 100"/>
  <circle class="ponto" cx="150" cy="100" r="9"/>
  <text class="nome" x="132" y="88" text-anchor="end">Santa Cecília</text>
  <text class="dado" x="132" y="105" text-anchor="end">770 m · 10 min</text>
  <text class="fraco" x="132" y="121" text-anchor="end">↑ oeste, Linha 3</text>

  <!-- eixo principal: Rua Maua, sentido sudeste -->
  <path class="via" d="M 150 175 L 596 175"/>
  <text class="rua" x="196" y="163">Rua Mauá, sentido sudeste →</text>

  <!-- origem -->
  <circle class="orig" cx="150" cy="175" r="11"/>
  <text class="nome" x="150" y="207" text-anchor="middle">CAES</text>
  <text class="dado" x="150" y="224" text-anchor="middle">Pça. Júlio Prestes</text>
  <text class="fraco" x="150" y="240" text-anchor="middle">0 m</text>

  <!-- Santa Ifigenia -->
  <circle class="ponto" cx="300" cy="175" r="9"/>
  <path class="ramo" d="M 300 175 L 300 252"/>
  <text class="nome" x="300" y="272" text-anchor="middle">Santa Ifigênia</text>
  <text class="dado" x="300" y="289" text-anchor="middle">~450 m · 6 min</text>
  <text class="fraco" x="300" y="305" text-anchor="middle">eletrônico, cabo, extensão</text>

  <!-- Estacao da Luz -->
  <circle class="ponto" cx="430" cy="175" r="9"/>
  <text class="fraco" x="430" y="105" text-anchor="middle">Linhas 1-Azul e 4-Amarela</text>
  <text class="nome" x="430" y="124" text-anchor="middle">Estação da Luz</text>
  <text class="dado" x="430" y="141" text-anchor="middle">712 m · 10 min</text>

  <!-- 25 de Marco -->
  <circle class="ponto" cx="596" cy="175" r="9"/>
  <text class="nome" x="632" y="207" text-anchor="end">25 de Março</text>
  <text class="dado" x="632" y="224" text-anchor="end">~1,9 km · 25 min</text>
  <text class="fraco" x="632" y="240" text-anchor="end">segue além da Luz</text>
</svg>
