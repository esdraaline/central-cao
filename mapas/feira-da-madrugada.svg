<svg viewBox="0 0 640 250" role="img" aria-label="Como chegar a Feira da Madrugada no Bras saindo do CAES">
  <style>
    .azul  { stroke: #2f7fd6; stroke-width: 7; fill: none; stroke-linecap: round; }
    .pe    { stroke: var(--tx3); stroke-width: 3.5; fill: none; stroke-linecap: round;
             stroke-dasharray: 7 6; }
    .ponto { fill: var(--card); stroke: #2f7fd6; stroke-width: 3.5; }
    .cinza { fill: var(--card); stroke: var(--tx3); stroke-width: 3.5; }
    .tit   { fill: var(--tx); font: 700 15px system-ui, sans-serif; }
    .nome  { fill: var(--tx); font: 700 13px system-ui, sans-serif; }
    .dado  { fill: var(--tx2); font: 12px system-ui, sans-serif; }
    .fraco { fill: var(--tx3); font: 11.5px system-ui, sans-serif; }
    .alerta{ fill: var(--vm-cl); font: 700 12px system-ui, sans-serif; }
  </style>

  <text class="tit" x="16" y="24">Feira da Madrugada: de trem, não a pé</text>
  <text class="fraco" x="16" y="42">A pé dá cerca de 4 km. Não compensa.</text>

  <!-- trecho a pe ate a Luz -->
  <circle class="cinza" cx="62" cy="112" r="10"/>
  <text class="nome" x="16" y="146">CAES</text>
  <text class="fraco" x="16" y="162">Pça. Júlio Prestes</text>
  <path class="pe" d="M 62 112 L 245 112"/>
  <text class="fraco" x="153" y="90" text-anchor="middle">a pé, 712 m</text>
  <text class="fraco" x="153" y="105" text-anchor="middle">10 min</text>

  <!-- Luz -->
  <circle class="ponto" cx="245" cy="112" r="10"/>
  <text class="nome" x="245" y="146" text-anchor="middle">Estação da Luz</text>
  <text class="dado" x="245" y="162" text-anchor="middle">Linha 1-Azul</text>

  <!-- trecho de metro -->
  <path class="azul" d="M 245 112 L 445 112"/>
  <text class="dado" x="345" y="90" text-anchor="middle">Linha 1-Azul, sentido leste</text>
  <text class="fraco" x="345" y="105" text-anchor="middle">poucas estações</text>

  <!-- Bras -->
  <circle class="ponto" cx="445" cy="112" r="10"/>
  <text class="nome" x="445" y="146" text-anchor="middle">Estação Brás</text>
  <text class="dado" x="445" y="162" text-anchor="middle">Metrô 3 + CPTM</text>

  <!-- a pe final -->
  <path class="pe" d="M 445 112 L 592 112"/>
  <text class="fraco" x="518" y="98" text-anchor="middle">poucos min a pé</text>
  <circle class="cinza" cx="592" cy="112" r="10"/>
  <text class="nome" x="630" y="146" text-anchor="end">Feira</text>
  <text class="dado" x="630" y="162" text-anchor="end">R. Oriente, 500</text>

  <text class="alerta" x="16" y="208">Funciona 00h às 16h, de segunda a sábado.</text>
  <text class="fraco" x="16" y="228">Quando você sai da aula, ela já fechou. A janela real é quinta, saída 11h30.</text>
</svg>
