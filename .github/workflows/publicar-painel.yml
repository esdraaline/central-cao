name: Publicar painel

# Por que este workflow existe:
#
# 1. Autonomia. Antes, o painel só era atualizado quando o Josemar lembrava de
#    rodar `python gerar_painel.py` e commitar. Editar um .md pelo celular ou
#    pela web do GitHub deixava o painel publicado velho, em silêncio. Agora
#    qualquer mudança num .md regenera e publica sozinha.
#
# 2. O build antigo do Pages parou de funcionar. Em 06/08/2026 o build "legacy"
#    (servir direto da pasta docs/ do branch) passou a falhar com a mensagem
#    generica "Page build failed", sem log nenhum, neste repositorio e tambem no
#    mentor-univesp-com170. Reaplicar a configuracao de source e empurrar commit
#    novo nao recuperou. O deploy por Action usa outro caminho e nao depende
#    daquele build.

on:
  push:
    branches: [main]
    # So republica quando muda o que o painel mostra. Push que mexe apenas no
    # README ou no proprio workflow nao precisa gastar uma publicacao.
    paths:
      - "*.md"
      - "gerar_painel.py"
      - "supabase.json"
      - ".github/workflows/publicar-painel.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # para commitar o painel regenerado
  pages: write      # para publicar
  id-token: write   # exigido pelo actions/deploy-pages

# Duas publicacoes ao mesmo tempo se atropelam e uma sobrescreve a outra.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # fetch-depth: 0 e obrigatorio. O gerador embute no painel a hora do
      # ultimo commit de cada .md (hora_do_md), e e ela que deixa o navegador
      # decidir quem esta mais novo: o arquivo do repositorio ou a marcacao
      # guardada naquele aparelho. Com o checkout raso (padrao, 1 commit) o
      # `git log` do arquivo vem vazio, a hora cai para a mtime do checkout
      # ("agora") e o arquivo passaria a ganhar sempre, apagando marcacao
      # feita no painel. Mesma exigencia do sincronizar-tarefas.yml.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # O gerador e Python puro, sem dependencia nenhuma. Se um dia precisar de
      # biblioteca, e aqui que entra o pip install.
      - name: Gerar o painel a partir dos .md
        run: python gerar_painel.py

      # O painel gerado volta para o repositorio para o arquivo versionado nunca
      # ficar diferente do que esta publicado. Sem isso, o proximo `git pull` numa
      # maquina do Josemar traria um painel velho e ele geraria por cima.
      - name: Guardar o painel no repositorio
        run: |
          git config user.name "painel-cao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Painel ja estava atualizado, nada a commitar."
          else
            git commit -m "Regenera o painel ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # O checkout traz o commit que DISPAROU o evento, nao o topo do
            # branch. Se main andou desde entao (o sincronizar-tarefas commitando,
            # ou um push seu logo em seguida), este push e recusado por nao ser
            # fast-forward. Foi o que derrubou a rodada de 24/08/2026 as 22:29,
            # que passou de primeira quando rerodada 13 segundos depois. Mesmo
            # laco do sincronizar-tarefas.yml.
            for TENTATIVA in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejeitado (tentativa $TENTATIVA). Rebase e tenta de novo."
              git pull --rebase origin main
            done
            echo "::error::Nao consegui empurrar o painel depois de 3 tentativas."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          # O padrao e 10 minutos. Em 06/08/2026 o Pages estava levando mais que
          # isso para promover o deploy: a Action desistia com "Timeout reached"
          # enquanto o proprio GitHub ainda dizia "deployment_in_progress", e
          # minutos depois o site aparecia atualizado. Ou seja, era a Action
          # desistindo cedo, nao o deploy falhando. 30 minutos cobre a lentidao
          # sem mascarar problema de verdade, porque o passo seguinte confere o
          # que esta no ar.
          timeout: 1800000

      # Publicar nao e o mesmo que estar servido. Confere que a pagina no ar ja e
      # a desta rodada antes de dar a Action como verde, senao um deploy que
      # falhou pela metade passaria despercebido.
      - name: Conferir que o site no ar e o desta rodada
        run: |
          # O carimbo e hash do conteudo (hexadecimal), nao mais data e hora.
          # A leitura antiga era 'content="[0-9]*"', que so casa com digito: com
          # a primeira letra no hash ela nao achava nada, o grep saia 1 e o
          # 'bash -e' matava o passo antes mesmo da primeira consulta ao site.
          carimbo_de() { sed -n 's/.*gerado-em" content="\([^"]*\)".*/\1/p' | head -1; }
          CARIMBO=$(carimbo_de < docs/index.html)
          if [ -z "$CARIMBO" ]; then
            echo "::error::Nao achei o carimbo gerado-em no docs/index.html."
            exit 1
          fi
          echo "Carimbo desta rodada: $CARIMBO"
          for TENTATIVA in $(seq 1 30); do
            NO_AR=$(curl -fsS -H "Cache-Control: no-cache" \
              "${{ steps.deploy.outputs.page_url }}?run=${GITHUB_RUN_ID}-${TENTATIVA}" 2>/dev/null \
              | carimbo_de || true)
            if [ "$NO_AR" = "$CARIMBO" ]; then
              echo "Confirmado: o site no ar e o desta rodada."
              exit 0
            fi
            sleep 6
          done
          echo "::error::O deploy terminou, mas em 3 minutos o site no ar ainda nao era o desta rodada (esperado $CARIMBO, encontrado $NO_AR)."
          exit 1
